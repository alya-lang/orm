[package]
name = "orm"
version = "0.1.0"
alya-version = "0.0.20"
entry = "src/lib.alya"
description = "Lightweight object-relational mapping for Alya: schema definitions, query builder, and typed row access over db"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/orm"
keywords = ["alya", "alya-lang", "package", "orm", "database", "sql", "model", "query", "schema"]

[dependencies]
db = { git = "https://github.com/alya-lang/db", tag = "v0.2.0" }

# Optional: feature-gated API slices. v0.1.0 ships the ungated core only.
[features]
default = []

